name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # once a day
  workflow_dispatch:       # allows running it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7b2cbf&color_dots=#ebedf0,#e0aaff,#c77dff,#9d4edd,#5a189a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c77dff&color_dots=#161b22,#3c096c,#5a189a,#9d4edd,#c77dff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
